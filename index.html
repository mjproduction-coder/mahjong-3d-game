<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tilevo Mahjong Match</title>
    <style>
      :root {
        --sky-top: #4cc9ff;
        --sky-mid: #56d3ff;
        --sky-bottom: #8fe4ff;
        --panel-gold: #f6c86c;
        --panel-gold-2: #f1ac4a;
        --panel-brown: #7a4d27;
        --panel-brown-dark: #5a2e18;
        --wood-1: #8a5526;
        --wood-2: #60411d;
        --wood-3: #3d2815;
        --tile-cream: #f9f1d8;
        --tile-cream-2: #f3e4bd;
        --tile-ink: #3a5b6f;
        --tile-pink: #ff9ad0;
        --tile-pink-dark: #f35fbe;
        --tile-red: #f66868;
        --tile-green: #61d279;
        --tile-blue: #57b8ff;
        --tile-gold: #ffd761;
        --tile-dark: #3b2a48;
        --shadow: rgba(0, 0, 0, 0.22);
        --board-lake: #cfe9ff;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(#6ed3ff, #9ae7ff 28%, #87d0ff 50%, #6bb8ff 100%);
        color: #fff;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
        overflow: auto;
      }

      .game {
        position: relative;
        width: min(100%, 440px);
        min-height: 900px;
        background:
          radial-gradient(circle at 50% 0%, rgba(255,255,255,0.5), transparent 25%),
          linear-gradient(180deg, rgba(255,255,255,0.08), rgba(18,25,64,0.1));
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0 28px 60px rgba(41, 33, 21, 0.3);
      }

      .sky {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(54, 155, 255, 0.3), transparent 25%),
          linear-gradient(180deg, var(--sky-top), var(--sky-mid) 45%, var(--sky-bottom));
      }

      .mountains {
        position: absolute;
        left: 0;
        right: 0;
        top: 150px;
        height: 200px;
        background:
          linear-gradient(135deg, transparent 40%, rgba(45, 103, 154, 0.9) 40%, rgba(45, 103, 154, 0.8) 65%, rgba(30, 93, 150, 0.8) 65%);
        clip-path: polygon(0 100%, 0 58%, 22% 36%, 34% 54%, 49% 32%, 62% 60%, 72% 42%, 83% 64%, 100% 38%, 100% 100%);
        opacity: 0.8;
      }

      .mountains::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(255,255,255,0.18), transparent 55%);
      }

      .pagoda {
        position: absolute;
        right: 46px;
        top: 170px;
        width: 118px;
        height: 112px;
        opacity: 0.9;
      }
      .pagoda .roof {
        position: absolute;
        left: 16px;
        right: 16px;
        top: 0;
        height: 22px;
        background: linear-gradient(180deg, #ec6d5b, #b42d2c);
        clip-path: polygon(0 100%, 12% 0, 88% 0, 100% 100%);
      }
      .pagoda .body {
        position: absolute;
        left: 10px;
        right: 10px;
        top: 20px;
        bottom: 0;
        background: linear-gradient(180deg, #ba4043, #8e2025 70%);
        border: 3px solid rgba(255,255,255,0.1);
        clip-path: polygon(10% 0, 90% 0, 100% 100%, 0 100%);
      }
      .pagoda .body::before, .pagoda .body::after {
        content: "";
        position: absolute;
        top: 18px;
        bottom: 16px;
        width: 12px;
        background: rgba(255,255,255,0.15);
      }
      .pagoda .body::before { left: 18px; }
      .pagoda .body::after { right: 18px; }
      .pagoda .door {
        position: absolute;
        left: 48px;
        bottom: 0;
        width: 18px;
        height: 28px;
        background: rgba(255, 213, 126, 0.8);
        border-radius: 8px 8px 0 0;
      }

      .blossom {
        position: absolute;
        width: 140px;
        height: 140px;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 30%, rgba(255,255,255,0.5), rgba(255,255,255,0) 40%);
        filter: blur(1px);
      }
      .blossom::before,
      .blossom::after {
        content: "";
        position: absolute;
        inset: 8px;
        border-radius: 50%;
        background: radial-gradient(circle, #ffaccf 0%, #f473bc 32%, rgba(255,255,255,0) 60%);
        box-shadow:
          0 0 0 18px rgba(255, 154, 200, 0.85),
          0 0 0 32px rgba(255, 188, 221, 0.4);
        transform: rotate(18deg);
      }

      .blossom.left { left: -24px; top: -20px; }
      .blossom.right { right: -16px; top: -8px; }

      .header {
        position: relative;
        z-index: 2;
        padding: 18px 18px 0;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
      }

      .pause {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: linear-gradient(145deg, #ffc77d, #eea73f);
        border: 4px solid rgba(150, 81, 23, 0.6);
        box-shadow: inset 0 2px 0 rgba(255,255,255,0.4), 0 8px 0 rgba(121, 66, 20, 0.7);
        display: grid;
        place-items: center;
        font-size: 26px;
        color: #fff;
        font-weight: 800;
      }

      .pause span {
        transform: translateY(-1px);
        text-shadow: 0 2px 0 rgba(0,0,0,0.18);
      }

      .title-box {
        flex: 1;
        display: flex;
        justify-content: center;
        margin: -2px 6px 0;
      }

      .title {
        position: relative;
        padding: 10px 18px 18px;
        border-radius: 30px 28px 24px 24px;
        background: linear-gradient(180deg, #dfb55e, #d99a2d 52%, #ca7f16);
        border: 5px solid rgba(142, 79, 22, 0.72);
        box-shadow: inset 0 3px 0 rgba(255,255,255,0.35), 0 8px 0 rgba(90,52,17,0.75);
        text-align: center;
        min-width: 212px;
      }
      .title::before, .title::after {
        content: "";
        position: absolute;
        top: 10px;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: linear-gradient(180deg, #35d049, #0c8d32);
        box-shadow: inset 0 2px 0 rgba(255,255,255,0.4), 0 2px 0 rgba(10,60,24,0.5);
      }
      .title::before { left: -12px; }
      .title::after { right: -12px; }

      .title-top {
        font-size: 15px;
        font-weight: 900;
        letter-spacing: 1px;
        color: #9f5311;
        text-transform: uppercase;
        text-shadow: 0 2px 0 rgba(255,255,255,0.3);
      }

      .title-main {
        display: block;
        font-size: clamp(2.5rem, 7vw, 4.2rem);
        line-height: 0.85;
        font-weight: 900;
        color: #ffe88c;
        letter-spacing: -3px;
        text-shadow: 0 4px 0 rgba(120, 65, 12, 0.9), 0 10px 18px rgba(181, 105, 22, 0.5);
      }

      .title-main small {
        display: block;
        font-size: 0.52em;
        letter-spacing: 0.04em;
        margin-top: 8px;
        font-weight: 800;
        color: #f7f5c0;
      }

      .panel-row {
        position: relative;
        z-index: 2;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-top: 14px;
        padding: 0 14px;
      }

      .score-card {
        width: 110px;
        min-height: 72px;
        background: linear-gradient(180deg, #a15f2d, #774220);
        border: 4px solid rgba(111, 63, 17, 0.9);
        border-radius: 18px;
        box-shadow: inset 0 2px 0 rgba(255,255,255,0.2), 0 8px 0 rgba(73, 42, 15, 0.7);
        text-align: center;
        color: #fff8d8;
        padding: 12px 10px 10px;
      }

      .score-card .label {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: #ffd89b;
      }

      .score-card .value {
        font-size: 18px;
        font-weight: 900;
        margin-top: 4px;
      }

      .stars {
        display: flex;
        gap: 4px;
        justify-content: center;
        margin-top: 4px;
      }
      .star {
        font-size: 18px;
        color: #ffdb6a;
        filter: drop-shadow(0 2px 0 rgba(130, 86, 22, 0.7));
      }

      .moves {
        width: 110px;
      }
      .moves .value {
        font-size: 28px;
        line-height: 1;
      }

      .board-wrap {
        position: relative;
        z-index: 2;
        margin: 16px 12px 0;
        border-radius: 0 0 24px 24px;
      }

      .board-scene {
        position: relative;
        min-height: 405px;
        border-radius: 22px 22px 0 0;
        background:
          linear-gradient(180deg, rgba(130, 196, 255, 0.2), transparent 28%),
          linear-gradient(180deg, #d3ecff 0%, #b9ddb0 58%, #64ae67 58%, #3b7d42 100%);
        box-shadow: inset 0 0 0 4px rgba(255,255,255,0.2);
        overflow: hidden;
      }

      .board-scene::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 112px;
        background: linear-gradient(180deg, #8d4b1e, #633a11 45%, #2e1b09);
        box-shadow: inset 0 10px 0 rgba(255,255,255,0.1);
      }

      .board-scene::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, transparent 0%, rgba(255,255,255,0.08) 100%);
        pointer-events: none;
      }

      .tree {
        position: absolute;
        bottom: 100px;
        width: 90px;
        height: 110px;
        opacity: 0.85;
      }
      .tree.left { left: 24px; }
      .tree.right { right: 22px; }
      .tree .trunk {
        position: absolute;
        left: 38px;
        bottom: 0;
        width: 14px;
        height: 78px;
        background: linear-gradient(180deg, #7a4a29, #4a2b18);
        border-radius: 10px;
      }
      .tree .leaf {
        position: absolute;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #a9f1b0, #4ac55b 55%, #1f8c44 100%);
        box-shadow: 0 0 0 3px rgba(22, 81, 36, 0.15);
      }
      .tree .leaf.l1 { left: 0; top: 12px; }
      .tree .leaf.l2 { left: 18px; top: 0; }
      .tree .leaf.l3 { right: 0; top: 18px; }
      .tree .leaf.l4 { left: 18px; top: 30px; }

      .mahjong-grid {
        position: relative;
        z-index: 3;
        margin: 0 auto;
        padding: 20px 18px 26px;
        width: min(100%, 360px);
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
        transform: perspective(1000px) rotateX(12deg) rotateY(-6deg);
      }

      .m-tile {
        position: relative;
        width: 100%;
        aspect-ratio: 0.82;
        border: none;
        background: transparent;
        border-radius: 18px;
        cursor: pointer;
        padding: 0;
        perspective: 1000px;
        transition: transform 0.2s ease;
      }
      .m-tile:hover { transform: translateY(-2px) scale(1.02); }
      .m-tile .inner {
        position: relative;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        transition: transform 0.55s ease;
      }
      .m-tile.flipped .inner,
      .m-tile.matched .inner {
        transform: rotateY(180deg);
      }
      .m-tile.matched {
        filter: saturate(1.1);
      }

      .face {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        backface-visibility: hidden;
        border-radius: 18px;
        box-shadow: 0 8px 15px rgba(33, 14, 9, 0.22);
      }
      .face.back {
        background: linear-gradient(180deg, #f8f1f1, #f0dcae);
        border: 4px solid rgba(125, 87, 44, 0.8);
        box-shadow: inset 0 2px 0 rgba(255,255,255,0.7), 0 10px 16px rgba(51, 34, 25, 0.15);
      }
      .face.back::before {
        content: "";
        position: absolute;
        inset: 8px 10px 8px 10px;
        border-radius: 12px;
        background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(180,115,37,0.12));
        border: 2px solid rgba(138, 90, 42, 0.28);
      }
      .face.back::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(255,255,255,0.28), transparent 20%);
        border-radius: 16px;
      }

      .face.front {
        background: linear-gradient(180deg, #fefaf0, #f2e3bb);
        border: 4px solid rgba(146, 116, 46, 0.7);
        color: #1a5d7a;
        font-weight: 900;
        font-size: clamp(2.1rem, 3vw, 2.9rem);
        transform: rotateY(180deg);
      }
      .face.front::before {
        content: "";
        position: absolute;
        inset: 5px 8px 5px 8px;
        border-radius: 12px;
        border: 2px solid rgba(118, 83, 41, 0.25);
      }
      .m-tile.matched .face.front {
        background: linear-gradient(180deg, #f7fff5, #d6f4d4);
        border-color: rgba(21, 123, 60, 0.8);
      }

      .tile-sigil {
        position: relative;
        z-index: 2;
        text-shadow: 0 2px 0 rgba(255,255,255,0.34);
      }

      .tile-sigil.color-red { color: #e65555; }
      .tile-sigil.color-green { color: #1e9a5c; }
      .tile-sigil.color-blue { color: #2c8ed8; }
      .tile-sigil.color-gold { color: #d6941d; }
      .tile-sigil.color-pink { color: #ea64b8; }
      .tile-sigil.color-purple { color: #7d5bc7; }

      .tile-sigil.small { font-size: 1.4rem; }

      .selection {
        position: relative;
        z-index: 5;
        margin: 0 16px;
        background: linear-gradient(180deg, rgba(113, 52, 20, 0.85), rgba(62, 33, 13, 0.92));
        border: 5px solid rgba(70, 39, 17, 0.8);
        border-radius: 18px 18px 28px 28px;
        box-shadow: inset 0 2px 0 rgba(255,255,255,0.16), 0 12px 0 rgba(54, 27, 11, 0.78);
        min-height: 110px;
        padding: 14px 20px;
      }

      .selection-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .choice-row {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .mini-tile {
        width: 74px;
        height: 74px;
        border-radius: 18px;
        background: linear-gradient(180deg, #fef9ef, #f5e5b9);
        border: 3px solid rgba(120, 84, 40, 0.7);
        box-shadow: inset 0 2px 0 rgba(255,255,255,0.7), 0 8px 0 rgba(70, 49, 20, 0.38);
        display: grid;
        place-items: center;
        font-size: 2.2rem;
        color: #1d6e9a;
      }
      .mini-tile:nth-child(2) { color: #3fa06d; }
      .mini-tile:nth-child(3) { color: #d65b59; }

      .accept {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: linear-gradient(180deg, #79d468, #3acias?);
        border: 4px solid rgba(35, 132, 57, 0.8);
        box-shadow: inset 0 2px 0 rgba(255,255,255,0.5), 0 10px 0 rgba(31, 108, 51, 0.75);
        display: grid;
        place-items: center;
        font-weight: 900;
        color: #fff;
        font-size: 26px;
      }

      .controls {
        position: relative;
        z-index: 4;
        display: flex;
        justify-content: center;
        gap: 18px;
        margin: 20px 16px 18px;
      }

      .circle-btn {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        border: 4px solid rgba(95, 57, 26, 0.85);
        background: linear-gradient(180deg, #f9d698, #db9a2d);
        box-shadow: inset 0 3px 0 rgba(255,255,255,0.5), 0 10px 0 rgba(107, 69, 24, 0.75);
        display: grid;
        place-items: center;
        font-size: 26px;
        color: #685516;
        font-weight: 900;
      }
      .circle-btn.alt { background: linear-gradient(180deg, #f9cc63, #d19d1e); }
      .circle-btn.red { background: linear-gradient(180deg, #f27d8f, #d94d4d); color: #fff; }
      .circle-btn.green { background: linear-gradient(180deg, #8fe77e, #3db85a); color: #fff; }

      .circle-btn .glyph {
        display: block;
        transform: translateY(-2px);
      }

      .cursor { position: absolute; }

      @media (max-width: 430px) {
        .game { min-height: 850px; }
        .title-main { font-size: 3rem; }
      }
    </style>
  </head>
  <body>
    <div class="game">
      <div class="sky"></div>
      <div class="blossom left"></div>
      <div class="blossom right"></div>
      <div class="mountains"></div>
      <div class="pagoda" aria-hidden="true">
        <div class="roof"></div>
        <div class="body"></div>
        <div class="door"></div>
      </div>

      <header class="header">
        <div class="pause" aria-label="Pause"><span>II</span></div>

        <div class="title-box">
          <div class="title">
            <div class="title-top">Tilevo</div>
            <span class="title-main">Tilevo<small>Mahjong Match</small></span>
          </div>
        </div>
      </header>

      <div class="panel-row">
        <div class="score-card">
          <div class="label">Level</div>
          <div class="value">12</div>
          <div class="stars" aria-label="stars">
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
          </div>
        </div>

        <div class="score-card moves">
          <div class="label">Moves</div>
          <div class="value">18</div>
        </div>
      </div>

      <div class="board-wrap">
        <div class="board-scene">
          <div class="tree left" aria-hidden="true">
            <div class="trunk"></div>
            <div class="leaf l1"></div>
            <div class="leaf l2"></div>
            <div class="leaf l3"></div>
            <div class="leaf l4"></div>
          </div>

          <div class="tree right" aria-hidden="true">
            <div class="trunk"></div>
            <div class="leaf l1"></div>
            <div class="leaf l2"></div>
            <div class="leaf l3"></div>
            <div class="leaf l4"></div>
          </div>

          <div class="mahjong-grid" id="board" aria-label="Mahjong board"></div>
        </div>
      </div>

      <div class="selection" aria-label="selected tiles">
        <div class="selection-inner">
          <div class="choice-row">
            <div class="mini-tile">🐦</div>
            <div class="mini-tile">🍀</div>
            <div class="mini-tile">🌸</div>
          </div>
          <div class="accept" aria-label="confirm">✓</div>
        </div>
      </div>

      <div class="controls" aria-label="game controls">
        <div class="circle-btn" aria-label="Search"><span class="glyph">⌕</span></div>
        <div class="circle-btn alt" aria-label="Shuffle"><span class="glyph">↻</span></div>
        <div class="circle-btn red" aria-label="Bomb"><span class="glyph">✦</span></div>
        <div class="circle-btn green" aria-label="Hint"><span class="glyph">💡</span></div>
      </div>
    </div>

    <script>
      const board = document.getElementById('board');

      const tileSet = [
        { text: '東', color: 'color-red' },
        { text: '發', color: 'color-red' },
        { text: '中', color: 'color-gold' },
        { text: '南', color: 'color-green' },
        { text: '白', color: 'color-blue' },
        { text: '🐦', color: 'color-blue' },
        { text: '🌿', color: 'color-green' },
        { text: '🌸', color: 'color-pink' }
      ];

      const deck = [...tileSet, ...tileSet].map((tile, index) => ({ ...tile, id: index }));
      const shuffled = deck.sort(() => Math.random() - 0.5);

      function createTile(item) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'm-tile';
        button.setAttribute('aria-label', 'Match tile');
        button.dataset.key = item.text;
        button.innerHTML = `
          <div class="inner">
            <div class="face back"></div>
            <div class="face front"><span class="tile-sigil ${item.color} ${item.text.length > 2 ? 'small' : ''}">${item.text}</span></div>
          </div>
        `;

        button.addEventListener('click', () => {
          if (button.classList.contains('flipped') || button.classList.contains('matched')) return;
          button.classList.add('flipped');

          const flipped = [...document.querySelectorAll('.m-tile.flipped:not(.matched)')];
          if (flipped.length === 2) {
            const [a, b] = flipped;
            if (a.dataset.key === b.dataset.key) {
              setTimeout(() => {
                a.classList.add('matched');
                b.classList.add('matched');
                a.classList.remove('flipped');
                b.classList.remove('flipped');
              }, 260);
            } else {
              setTimeout(() => {
                a.classList.remove('flipped');
                b.classList.remove('flipped');
              }, 500);
            }
          }
        });

        return button;
      }

      shuffled.forEach((item) => {
        board.appendChild(createTile(item));
      });
    </script>
  </body>
</html>
